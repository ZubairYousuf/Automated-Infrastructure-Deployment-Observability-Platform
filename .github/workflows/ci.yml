name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements-dev.txt
      - name: Lint
        run: ruff check app
      - name: Unit tests
        run: pytest -q app/tests
      - name: Build image
        run: docker build -f app/Dockerfile -t cloudops-api:ci .
      - name: Container smoke test
        run: |
          docker run -d --name cloudops-ci -p 127.0.0.1:8000:8000 cloudops-api:ci
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then exit 0; fi
            sleep 2
          done
          docker logs cloudops-ci
          exit 1
      - name: Trivy filesystem scan (HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
